services:
  mysql:
    image: mysql:8.4
    container_name: mxxssm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mxxssm_admin}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_USER: ${MYSQL_USER:-mxxssm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mxxssm-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: 'jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mxxssm_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true'
      DB_USERNAME: ${MYSQL_USER:-mxxssm}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      # Local compose serves HTTP; enable this only when TLS terminates in front of the app.
      SERVER_SERVLET_SESSION_COOKIE_SECURE: 'false'
      LOG_FILE: /app/logs/mxxssm.log
    ports:
      - '${APP_PORT:-8081}:8081'
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  mysql-data:
  app-logs:
